name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试与护栏自检
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成示例库（确定性随机种子，可复现）
        run: python -m app.db.seed

      - name: 安全护栏自检（AST 只读白名单）
        run: python -m app.guardrails

      # 关键：刻意把 Ollama 指向一个不存在的端口。
      # 这不只是为了省事——它能保证测试套件真的不依赖任何模型服务。
      # 如果哪天有人加了依赖真实模型的用例，CI 会在这一步立刻红掉，
      # 而不是靠本地开着 Ollama 侥幸跑绿。
      - name: 运行测试（离线，不依赖模型服务）
        run: python -m pytest tests -q
        env:
          NL2SQL_OLLAMA_BASE: http://127.0.0.1:59999
          NL2SQL_EMBED_MODEL: ''
