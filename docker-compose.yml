# docker compose up -d  ：起 API + 本地 Ollama 推理服务
#
# 说明：
#   - ollama 首次启动后需要拉模型：docker compose exec ollama ollama pull qwen2.5:7b
#   - 容器内 GPU 推理需要 NVIDIA Container Toolkit；没有 GPU 时 Ollama 会自动用 CPU
#     （Agent 侧默认 num_gpu=0，等价于强制 CPU，避免驱动/内核不匹配把服务打崩）
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NL2SQL_LLM_BACKEND: ollama
      NL2SQL_MODEL: qwen2.5:7b
      NL2SQL_OLLAMA_BASE: http://ollama:11434
      NL2SQL_OLLAMA_NUM_GPU: "0"
      NL2SQL_N_CANDIDATES: "3"
      NL2SQL_MAX_REPAIR_ROUNDS: "2"
    volumes:
      - ./data:/app/data:ro
      - ./traces:/app/traces
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
